<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Engramme" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1c1c1f" />
    <script>
      try {
        var t = localStorage.getItem('engramme.theme')
        document.documentElement.dataset.theme =
          t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        var c = JSON.parse(localStorage.getItem('engramme.colors') || 'null')
        if (c) {
          var style = document.documentElement.style
          style.setProperty('--brand-1', c.primary)
          style.setProperty('--brand-2', c.secondary)
          style.setProperty('--on-accent', c.onPrimary)
        }
      } catch (e) {}
    </script>
    <title>Engramme</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
